name: Fork CI

on:
  push:
    branches:
      - agent-platform/v2026.6.1-baseline
      - codex/**

permissions:
  contents: read

concurrency:
  group: openclaw-fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  trusted-linux:
    name: Trusted Linux full validation
    runs-on: [self-hosted, Linux, X64, openclaw-lab, openclaw-fork-ci]
    timeout-minutes: 90
    steps:
      - name: Initialize task-local roots
        env:
          TASK_ROOT: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$TASK_ROOT/home" \
            "$TASK_ROOT/xdg-cache" \
            "$TASK_ROOT/pnpm" \
            "$TASK_ROOT/corepack"
          {
            printf 'HOME=%s\n' "$TASK_ROOT/home"
            printf 'XDG_CACHE_HOME=%s\n' "$TASK_ROOT/xdg-cache"
            printf 'PNPM_HOME=%s\n' "$TASK_ROOT/pnpm"
            printf 'COREPACK_HOME=%s\n' "$TASK_ROOT/corepack"
          } >> "$GITHUB_ENV"

      - name: Prove isolated Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == Linux ]]
          [[ "$(uname -m)" == x86_64 ]]
          mkdir -p "$HOME" "$XDG_CACHE_HOME" "$PNPM_HOME" "$COREPACK_HOME"
          for tool in bash git node npm corepack; do
            resolved="$(readlink -f "$(command -v "$tool")")"
            case "$resolved" in
              /mnt/*|*.exe|*.cmd|*.bat) exit 1 ;;
              /*) ;;
              *) exit 1 ;;
            esac
          done

      - name: Check out trusted same-repository source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Activate pinned pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          for tool in node npm corepack pnpm; do
            resolved="$(readlink -f "$(command -v "$tool")")"
            case "$resolved" in
              /mnt/*|*.exe|*.cmd|*.bat) exit 1 ;;
              /*) ;;
              *) exit 1 ;;
            esac
          done
          node --version | grep -Fx 'v24.15.0'
          pnpm --version | grep -Fx '11.2.2'

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Check with exact inherited-baseline classification
        env:
          BASE_REF: agent-platform/v2026.6.1-baseline
        shell: bash
        run: |
          set -euo pipefail
          check_log="$RUNNER_TEMP/pnpm-check.log"
          set +e
          pnpm check 2>&1 | tee "$check_log"
          check_status=${PIPESTATUS[0]}
          set -e
          if [[ "$check_status" -eq 0 ]]; then
            exit 0
          fi

          failure_count=$(grep -Ec 'failed:[0-9]+[[:space:]]+' "$check_log" || true)
          shrinkwrap_failure_count=$(
            grep -Ec 'failed:[0-9]+[[:space:]]+npm shrinkwrap guard$' "$check_log" || true
          )
          [[ "$failure_count" -eq 1 ]]
          [[ "$shrinkwrap_failure_count" -eq 1 ]]

          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          base_sha=$(git rev-parse "refs/remotes/origin/$BASE_REF^{commit}")
          git diff --quiet "$base_sha" -- \
            package.json \
            pnpm-lock.yaml \
            npm-shrinkwrap.json \
            extensions

          printf 'inheritedBaselineFailure=npm_shrinkwrap_guard\n' >> "$GITHUB_STEP_SUMMARY"

          type_log="$RUNNER_TEMP/tsgo-all.log"
          set +e
          pnpm tsgo:all 2>&1 | tee "$type_log"
          type_status=${PIPESTATUS[0]}
          set -e
          if [[ "$type_status" -ne 0 ]]; then
            type_failure_count=$(grep -Ec 'error TS[0-9]+:' "$type_log" || true)
            known_failure_count=$(
              grep -Fc "'isSilentReplyPayloadText' is declared but its value is never read." \
                "$type_log" || true
            )
            [[ "$type_failure_count" -eq 1 ]]
            [[ "$known_failure_count" -eq 1 ]]
            git diff --quiet "$base_sha" -- src/cron/isolated-agent/run.ts
            printf 'inheritedBaselineFailure=isolated_agent_unused_import\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          lint_log="$RUNNER_TEMP/pnpm-lint.log"
          set +e
          pnpm lint 2>&1 | tee "$lint_log"
          lint_status=${PIPESTATUS[0]}
          set -e
          if [[ "$lint_status" -ne 0 ]]; then
            known_lint_count=$(
              grep -Fc "Identifier 'isSilentReplyPayloadText' is imported but never used." \
                "$lint_log" || true
            )
            [[ "$known_lint_count" -eq 1 ]]
            grep -Fq 'Found 0 warnings and 1 error' "$lint_log"
            git diff --quiet "$base_sha" -- src/cron/isolated-agent/run.ts
            printf 'inheritedBaselineFailure=isolated_agent_unused_import_lint\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          for policy_check in \
            lint:webhook:no-low-level-body-read \
            check:no-runtime-action-load-config \
            check:deprecated-api-usage \
            check:temp-path-guardrails \
            lint:auth:no-pairing-store-group \
            lint:auth:pairing-account-scope \
            check:import-cycles
          do
            pnpm "$policy_check"
          done

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Prove source-bound package reproducibility
        env:
          GIT_COMMIT: ${{ github.sha }}
          OPENCLAW_BUILD_TIMESTAMP: "2026-01-01T00:00:00.000Z"
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/pack-first"
          second="$RUNNER_TEMP/pack-second"
          mkdir -p "$first" "$second"
          pnpm pack --pack-destination "$first" >/dev/null
          pnpm pack --pack-destination "$second" >/dev/null
          mapfile -t first_archives < <(find "$first" -maxdepth 1 -type f -name '*.tgz')
          mapfile -t second_archives < <(find "$second" -maxdepth 1 -type f -name '*.tgz')
          [[ "${#first_archives[@]}" -eq 1 ]]
          [[ "${#second_archives[@]}" -eq 1 ]]
          cmp --silent "${first_archives[0]}" "${second_archives[0]}"
          sha256sum "${first_archives[0]}" | cut -d ' ' -f 1 >> "$GITHUB_STEP_SUMMARY"

      - name: Clean task-local source state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git clean -ffdx
